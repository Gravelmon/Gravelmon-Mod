name: Sync Gravelmon submissions

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve merged PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const pr = data.find((p) => p.merged_at);
            core.setOutput('number', pr ? String(pr.number) : '');

      - name: Award points and update model status
        env:
          GRAVELMON_API_DOMAIN: https://submit.gravelmon.com
          POKEMON_STATUS_INTERNAL_TOKEN: ${{ secrets.POKEMON_STATUS_INTERNAL_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: node .github/scripts/gravelmon-sync.js "${{ github.event.before }}" "${{ github.sha }}"
